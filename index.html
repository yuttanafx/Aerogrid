<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>AEROGRID — แผนที่ความหนาแน่นคุณภาพอากาศโลก (Live)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --hairline: rgba(180,200,220,0.10);
    --c-good: #4FD1B8;
    --c-moderate: #E8C25A;
    --c-usg: #E89B4C;
    --c-unhealthy: #E1615E;
    --c-veryunhealthy: #A667C9;
    --c-hazardous: #B0466B;
  }
  [data-theme="dark"]{
    --bg: #090c11; --bg-panel: #0f141b; --bg-panel-2: #131a22;
    --text: #E7EEF3; --text-dim: #7E8B98; --text-faint: #4A5560;
    --hairline: rgba(180,200,220,0.10);
    --input-bg:#0c1119;
  }
  [data-theme="light"]{
    --bg: #F1F4F7; --bg-panel: #FFFFFF; --bg-panel-2: #F7F9FB;
    --text: #101820; --text-dim: #5B6773; --text-faint: #93A0AB;
    --hairline: rgba(10,25,40,0.09);
    --input-bg:#FFFFFF;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'IBM Plex Sans Thai','IBM Plex Sans',sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    transition:background .25s ease, color .25s ease;
  }
  body[data-lang="zh"]{ font-family:'Noto Sans SC','IBM Plex Sans',sans-serif; }
  .mono{font-family:'IBM Plex Mono',monospace;}
  .display{font-family:'Space Grotesk','IBM Plex Sans Thai',sans-serif;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:.01ms !important; transition-duration:.01ms !important;} }
  a{color:inherit;}
  ::selection{background:var(--c-usg); color:#0a0a0a;}

  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 40px; border-bottom:1px solid var(--hairline);
    position:relative; z-index:20; gap:16px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:18px; }
  .brand-mark{ width:10px; height:10px; border-radius:50%; background:var(--c-usg);
    box-shadow:0 0 0 3px rgba(232,155,76,0.15); animation: mark-pulse 2.6s ease-in-out infinite; flex-shrink:0;}
  @keyframes mark-pulse{ 0%,100%{box-shadow:0 0 0 3px rgba(232,155,76,0.15);} 50%{box-shadow:0 0 0 7px rgba(232,155,76,0.03);} }

  .nav-right{ display:flex; align-items:center; gap:14px; }
  .langsw{ display:flex; border:1px solid var(--hairline); border-radius:8px; overflow:hidden; }
  .langsw button{
    background:none; border:none; color:var(--text-dim); font-family:'IBM Plex Mono',monospace;
    font-size:12px; padding:8px 12px; cursor:pointer; transition:.15s;
  }
  .langsw button.active{ background:var(--c-usg); color:#0a0a0a; font-weight:600; }
  .langsw button:not(.active):hover{ color:var(--text); background:var(--bg-panel-2); }

  .theme-toggle{
    width:36px; height:36px; border-radius:50%; border:1px solid var(--hairline);
    background:var(--bg-panel); cursor:pointer; display:flex; align-items:center; justify-content:center;
    position:relative; flex-shrink:0;
  }
  .theme-toggle svg{ width:17px; height:17px; }
  .icon-sun{ display:none; }
  .icon-moon{ display:block; }
  [data-theme="light"] .icon-sun{ display:block; }
  [data-theme="light"] .icon-moon{ display:none; }
  .theme-toggle .icon-sun{ color:#E8C25A; }
  .theme-toggle .icon-moon{ color:#9AB0C7; }
  button:focus-visible, .card:focus-visible, input:focus-visible{ outline:2px solid var(--c-usg); outline-offset:2px; }

  .hero{ position:relative; padding:48px 40px 20px; max-width:1360px; margin:0 auto; }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--c-usg); display:flex; align-items:center; gap:10px; margin-bottom:18px;
  }
  .eyebrow::before{ content:''; width:22px; height:1px; background:var(--c-usg); opacity:.6; }
  .hero-grid{ display:grid; grid-template-columns:1.05fr 0.95fr; gap:40px; align-items:end; }
  @media (max-width:980px){ .hero-grid{grid-template-columns:1fr;} }
  h1{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:clamp(28px,4vw,48px); line-height:1.08; letter-spacing:-0.01em; margin:0 0 16px; }
  body[data-lang="zh"] h1{ font-family:'Noto Sans SC','Space Grotesk',sans-serif; }
  h1 em{ font-style:normal; background:linear-gradient(90deg, var(--c-usg), var(--c-unhealthy)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero-sub{ color:var(--text-dim); font-size:15.5px; line-height:1.65; max-width:48ch; margin:0 0 24px; }
  .hero-stat-row{ display:flex; gap:32px; flex-wrap:wrap; }
  .stat-num{ font-family:'IBM Plex Mono',monospace; font-size:30px; font-weight:600; }
  .stat-label{ font-size:11.5px; color:var(--text-faint); margin-top:4px; max-width:16ch; }

  .map-panel{ background:var(--bg-panel); border:1px solid var(--hairline); border-radius:14px; padding:14px; position:relative; }
  .map-panel-head{ display:flex; justify-content:space-between; align-items:center; padding:2px 6px 12px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-faint); letter-spacing:.06em; text-transform:uppercase; gap:10px; flex-wrap:wrap;}
  .live-dot{ width:6px; height:6px; border-radius:50%; background:var(--c-good); display:inline-block; margin-right:6px; animation: live 1.8s ease-in-out infinite; }
  @keyframes live{ 0%,100%{opacity:1;} 50%{opacity:.25;} }
  .refresh-btn{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:6px 10px; border-radius:6px;
    border:1px solid var(--hairline); background:var(--bg-panel-2); color:var(--text); cursor:pointer;
  }
  .refresh-btn:hover{ border-color:var(--c-usg); }
  .refresh-btn:disabled{ opacity:.5; cursor:default; }

  #leafletMap{ width:100%; height:420px; border-radius:10px; overflow:hidden; }
  .leaflet-popup-content-wrapper{ background:var(--bg-panel); color:var(--text); border-radius:8px; }
  .leaflet-popup-tip{ background:var(--bg-panel); }
  .popup-city{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px; margin-bottom:2px; }
  .popup-aqi{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; }
  .popup-band{ font-size:11px; margin-top:2px; }
  .popup-meta{ font-size:10.5px; color:var(--text-faint); margin-top:6px; }

  .key-panel{
    display:flex; gap:8px; align-items:center; padding:10px 6px 4px; flex-wrap:wrap;
    font-size:12px; color:var(--text-dim);
  }
  .key-panel input{
    background:var(--input-bg); border:1px solid var(--hairline); color:var(--text);
    border-radius:6px; padding:8px 10px; font-family:'IBM Plex Mono',monospace; font-size:12px;
    flex:1; min-width:180px;
  }
  .key-panel button{
    font-family:'IBM Plex Mono',monospace; font-size:11px; padding:8px 12px; border-radius:6px;
    border:1px solid var(--hairline); background:var(--c-usg); color:#0a0a0a; cursor:pointer; font-weight:600;
  }
  .key-status{ font-size:11px; color:var(--text-faint); padding:0 6px 6px; }
  .key-status a{ color:var(--c-usg); text-decoration:underline; }

  .legend-strip{ max-width:1360px; margin:0 auto; padding:24px 40px 8px; display:flex; flex-wrap:wrap; gap:20px; align-items:center; border-bottom:1px solid var(--hairline); }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-dim); }
  .legend-swatch{ width:9px; height:9px; border-radius:2px; flex-shrink:0; }
  .legend-title{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.1em; margin-right:4px; }

  .section{ max-width:1360px; margin:0 auto; padding:48px 40px 30px; }
  .section-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:24px; gap:20px; flex-wrap:wrap; }
  .section-title{ font-family:'Space Grotesk',sans-serif; font-size:21px; font-weight:600; }
  .section-note{ font-size:13px; color:var(--text-faint); max-width:38ch; }

  .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  @media (max-width:920px){ .grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:600px){ .grid{grid-template-columns:1fr;} }

  .card{ background:var(--bg-panel); border:1px solid var(--hairline); border-radius:12px; padding:20px 20px 18px; position:relative; transition:border-color .2s, transform .2s; }
  .card:hover{ border-color:rgba(150,160,170,0.35); transform:translateY(-2px); }
  .card-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
  .continent-name{ font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px; }
  .continent-city{ font-size:12px; color:var(--text-faint); margin-top:2px; }
  .band-pill{ font-family:'IBM Plex Mono',monospace; font-size:10px; padding:3px 8px; border-radius:20px; white-space:nowrap; font-weight:600; }
  .aqi-num{ font-family:'IBM Plex Mono',monospace; font-size:36px; font-weight:600; line-height:1; }
  .aqi-unit{ font-size:11px; color:var(--text-faint); margin-top:6px; }
  .bar-track{ height:5px; border-radius:3px; background:rgba(140,150,160,0.16); margin-top:16px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:3px; transition:width .5s ease; }
  .card-foot{ display:flex; justify-content:space-between; margin-top:12px; font-size:11px; color:var(--text-faint); }
  .skeleton{ opacity:.45; }

  footer{ max-width:1360px; margin:0 auto; padding:30px 40px 60px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px; color:var(--text-faint); font-size:12px; border-top:1px solid var(--hairline); }
  .disclosure{ max-width:1360px; margin:0 auto; padding:0 40px; font-size:11.5px; color:var(--text-faint); line-height:1.6; }
</style>
</head>

<nav>
  <div class="brand"><span class="brand-mark"></span>AEROGRID</div>
  <div class="nav-right">
    <div class="langsw" role="group" aria-label="Language">
      <button data-lang-btn="th" class="active">TH</button>
      <button data-lang-btn="en">EN</button>
      <button data-lang-btn="zh">中文</button>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>

    </button>
  </div>
</nav>

<div class="hero" id="map">
  <div class="eyebrow" data-i18n="eyebrow">Live Air Density Index</div>
  <div class="hero-grid">
    <div>
      <h1 data-i18n-html="h1"></h1>
      <p class="hero-sub" data-i18n="sub"></p>
      <div class="hero-stat-row">
        <div class="stat"><div class="stat-num mono" style="color:var(--c-usg);" id="globalAvg">—</div><div class="stat-label" data-i18n="statAvg"></div></div>
        <div class="stat"><div class="stat-num mono" id="statCities">14</div><div class="stat-label" data-i18n="statCities"></div></div>
        <div class="stat"><div class="stat-num mono" style="color:var(--c-unhealthy);" id="statDanger">—</div><div class="stat-label" data-i18n="statDanger"></div></div>
      </div>
    </div>

    <div class="map-panel">
      <div class="map-panel-head">
        <span><span class="live-dot"></span><span data-i18n="scanning"></span></span>
        <button class="refresh-btn" id="refreshBtn" data-i18n="refresh"></button>
      </div>
      <div id="leafletMap"></div>
      <div class="key-panel">
        <span data-i18n="apiKeyLabel"></span>
        <input type="text" id="apiKeyInput" placeholder="WAQI API token" autocomplete="off" spellcheck="false">
        <button id="apiKeySave" data-i18n="save"></button>
      </div>
      <div class="key-status" id="keyStatus"></div>
    </div>
  </div>
</div>

<div class="legend-strip" id="legend">
  <span class="legend-title" data-i18n="legendTitle"></span>
  <div class="legend-item"><span class="legend-swatch" style="background:#4FD1B8;"></span><span data-i18n="bandGood"></span> 0–50</div>
  <div class="legend-item"><span class="legend-swatch" style="background:#E8C25A;"></span><span data-i18n="bandModerate"></span> 51–100</div>
  <div class="legend-item"><span class="legend-swatch" style="background:#E89B4C;"></span><span data-i18n="bandUsg"></span> 101–150</div>
  <div class="legend-item"><span class="legend-swatch" style="background:#E1615E;"></span><span data-i18n="bandUnhealthy"></span> 151–200</div>
  <div class="legend-item"><span class="legend-swatch" style="background:#A667C9;"></span><span data-i18n="bandVeryUnhealthy"></span> 201–300</div>
  <div class="legend-item"><span class="legend-swatch" style="background:#B0466B;"></span><span data-i18n="bandHazardous"></span> 300+</div>
</div>

<div class="section" id="continents">
  <div class="section-head">
    <div class="section-title" data-i18n="sectionTitle"></div>
    <div class="section-note" data-i18n="sectionNote"></div>
  </div>
  <div class="grid" id="continentGrid"></div>
</div>

<p class="disclosure" id="about" data-i18n-html="disclosure"></p>

<footer>
  <div data-i18n="footerLeft"></div>
  <div data-i18n="footerRight"></div>
</footer>

    needKey: "尚未设置 API 密钥 — ", getKeyLink: "前往 WAQI 免费申请",
    keyOk: "密钥已保存，正在获取数据…",
    corsWarn: "如果浏览器因 CORS 阻止请求，请通过您自己的后端代理调用，而不是从页面直接请求。",
    updated: "更新于",
    stations: "个监测站",
    worst: "最高值"
  }
};

const CONTINENT_NAME = {
  asia:     {th:"เอเชีย",         en:"Asia",          zh:"亚洲"},
  africa:   {th:"แอฟริกา",        en:"Africa",        zh:"非洲"},
  namerica: {th:"อเมริกาเหนือ",   en:"North America", zh:"北美洲"},
  samerica: {th:"อเมริกาใต้",     en:"South America", zh:"南美洲"},
  europe:   {th:"ยุโรป",          en:"Europe",        zh:"欧洲"},
  oceania:  {th:"โอเชียเนีย",     en:"Oceania",       zh:"大洋洲"},
};
const CONTINENT_ORDER = ["asia","africa","namerica","samerica","europe","oceania"];

// Rough, non-authoritative bounding-box classification — good enough for a dashboard aggregate.
function classifyContinent(lat, lon){
  // Oceania: Australia/NZ/Pacific island band
  if (lat <= -8 && ((lon >= 110 && lon <= 180) || (lon >= -180 && lon < -150))) return "oceania";
  // Americas split roughly at the Panama isthmus (~13°N)
  if (lon >= -170 && lon < -30){
    return lat >= 13 ? "namerica" : "samerica";
  }
  // Europe: north of ~37°N, roughly west of the Urals
  if (lat > 37 && lon >= -25 && lon < 60) return "europe";
  // Africa: everything else south of ~37°N within African/Med longitudes
  if (lat <= 37 && lon >= -20 && lon < 52) return "africa";
  // Default remainder (most of Asia, Middle East, Russia, SE Asia, etc.)
  return "asia";
}

/* ---------------- State ---------------- */
let state = { lang:"th", theme:"dark", apiKey:"", stations:[], markerLayer:null };

/* ---------------- AQI helpers ---------------- */
function band(aqi){
  if (aqi==null || isNaN(aqi)) return null;
  if (aqi<=50) return "good";
  if (aqi<=100) return "moderate";
  if (aqi<=150) return "usg";
  if (aqi<=200) return "unhealthy";
  if (aqi<=300) return "veryunhealthy";
  return "hazardous";
}
const BAND_COLOR = { good:"#4FD1B8", moderate:"#E8C25A", usg:"#E89B4C", unhealthy:"#E1615E", veryunhealthy:"#A667C9", hazardous:"#B0466B" };
const BAND_I18N_KEY = { good:"bandGood", moderate:"bandModerate", usg:"bandUsg", unhealthy:"bandUnhealthy", veryunhealthy:"bandVeryUnhealthy", hazardous:"bandHazardous" };
function bandLabel(b){ return b ? I18N[state.lang][BAND_I18N_KEY[b]] : I18N[state.lang].noKey; }
function radiusFor(aqi){ if(aqi==null) return 3; return Math.max(3, Math.min(16, 3 + aqi/22)); }

/* ---------------- Map setup ---------------- */
let map, tileLayer;
const TILES = {
  dark:  { url:"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", attribution:'&copy; OpenStreetMap contributors &copy; CARTO &copy; WAQI' },
  light: { url:"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", attribution:'&copy; OpenStreetMap contributors &copy; CARTO &copy; WAQI' }
};

function initMap(){
  map = L.map('leafletMap', { worldCopyJump:true, minZoom:1.5, preferCanvas:true }).setView([15, 20], 2);
  tileLayer = L.tileLayer(TILES[state.theme].url, { attribution:TILES[state.theme].attribution, maxZoom:19 }).addTo(map);
  state.markerLayer = L.layerGroup().addTo(map);
}

function popupHtml(st){
  const t = I18N[state.lang];
  const name = st.station && st.station.name ? st.station.name : `${st.lat.toFixed(2)}, ${st.lon.toFixed(2)}`;
  const b = band(st.aqi);
  if (b==null){
    return `<div class="popup-city">${name}</div><div class="popup-meta">${t.error}</div>`;
  }
  return `<div class="popup-city">${name}</div>
    <div class="popup-aqi" style="color:${BAND_COLOR[b]}">${st.aqi}</div>
    <div class="popup-band" style="color:${BAND_COLOR[b]}">${bandLabel(b)}</div>`;
}

function renderStationDots(){
  state.markerLayer.clearLayers();
  state.stations.forEach(st=>{
    const b = band(st.aqi);
    if (b==null) return;
    const marker = L.circleMarker([st.lat, st.lon], {
      radius: radiusFor(st.aqi), weight:1, color:"rgba(255,255,255,0.35)",
      fillColor: BAND_COLOR[b], fillOpacity:0.75
    });
    marker.bindPopup(popupHtml(st));
    marker.addTo(state.markerLayer);
  });
}

/* ---------------- Continent cards ---------------- */
function renderContinentCards(){
  const t = I18N[state.lang];
  const grid = document.getElementById('continentGrid');
  grid.innerHTML = "";

  const byContinent = {};
  CONTINENT_ORDER.forEach(c=>byContinent[c]=[]);
  state.stations.forEach(st=>{
    if (band(st.aqi)==null) return;
    const c = classifyContinent(st.lat, st.lon);
    if (byContinent[c]) byContinent[c].push(st);
  });

  CONTINENT_ORDER.forEach(cont=>{
    const list = byContinent[cont];
    const hasData = list.length>0;
    const avg = hasData ? Math.round(list.reduce((a,s)=>a+s.aqi,0)/list.length) : null;
    const worst = hasData ? list.reduce((a,s)=>s.aqi>a.aqi?s:a, list[0]) : null;
    const b = band(avg);
    const color = b ? BAND_COLOR[b] : "#7E8B98";
    const pct = avg!=null ? Math.min(100, avg/3.5) : 0;

    const card = document.createElement('div');
    card.className = "card";
    card.tabIndex = 0;
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="continent-name">${CONTINENT_NAME[cont][state.lang]}</div>
          <div class="continent-city">${worst ? `${t.worst}: ${worst.station ? worst.station.name : ""} (${worst.aqi})` : (state.apiKey ? t.loading : t.noKey)}</div>
        </div>
        <div class="band-pill" style="background:${color}2e; color:${color};">${b ? bandLabel(b) : t.noKey}</div>
      </div>
      <div class="aqi-num ${avg==null?'skeleton':''}" style="color:${color};">${avg!=null ? avg : '···'}</div>
      <div class="aqi-unit">AQI · WAQI</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${color};"></div></div>
      <div class="card-foot"><span>${list.length} ${t.stations}</span></div>
    `;
    grid.appendChild(card);
  });
}

function refreshTopStats(){
  const vals = state.stations.map(s=>s.aqi).filter(v=>v!=null && !isNaN(v));
  const globalAvg = document.getElementById('globalAvg');
  const statCities = document.getElementById('statCities');
  const statDanger = document.getElementById('statDanger');
  statCities.textContent = vals.length || "—";
  if (vals.length===0){ globalAvg.textContent = "—"; statDanger.textContent = "—"; return; }
  const avg = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  globalAvg.textContent = avg;
  statDanger.textContent = vals.filter(v=>v>150).length;
}

/* ---------------- Fetch from WAQI (one call for the whole visible world) ---------------- */
async function fetchAll(){
  const btn = document.getElementById('refreshBtn');
  if (!state.apiKey){
    document.getElementById('keyStatus').innerHTML =
      `${I18N[state.lang].needKey}<a href="https://aqicn.org/data-platform/token/" target="_blank" rel="noopener">${I18N[state.lang].getKeyLink}</a>`;
    state.stations = [];
    renderStationDots();
    renderContinentCards();
    refreshTopStats();
    return;
  }
  btn.disabled = true;
  document.getElementById('keyStatus').textContent = "";
  try{
    const url = `https://api.waqi.info/map/bounds/?latlng=-60,-180,85,180&token=${encodeURIComponent(state.apiKey)}`;
    const resp = await fetch(url);
    const data = await resp.json();
    if (data.status === "ok"){
      state.stations = data.data
        .map(s=>({ lat:s.lat, lon:s.lon, aqi: parseInt(s.aqi,10), station:s.station }))
        .filter(s=>!isNaN(s.aqi));
    } else {
      document.getElementById('keyStatus').textContent = `${I18N[state.lang].error}: ${data.data || ""}`;
      state.stations = [];
    }
  }catch(e){
    document.getElementById('keyStatus').textContent = `${I18N[state.lang].error} (${I18N[state.lang].corsWarn})`;
    state.stations = [];
  }
  renderStationDots();
  renderContinentCards();
  refreshTopStats();
  btn.disabled = false;
}

/* ---------------- i18n render ---------------- */
function renderLanguage(){
  const t = I18N[state.lang];
  document.body.setAttribute('data-lang', state.lang);
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t[el.getAttribute('data-i18n')]; });
  document.querySelectorAll('[data-i18n-html]').forEach(el=>{ el.innerHTML = t[el.getAttribute('data-i18n-html')]; });
  document.querySelectorAll('.langsw button').forEach(b=>b.classList.toggle('active', b.dataset.langBtn===state.lang));
  document.getElementById('apiKeyInput').placeholder = "WAQI API token";
  if (!state.apiKey){
    document.getElementById('keyStatus').innerHTML =
      `${t.needKey}<a href="https://aqicn.org/data-platform/token/" target="_blank" rel="noopener">${t.getKeyLink}</a>`;
  }
  renderContinentCards();
  renderStationDots();
}

/* ---------------- Theme ---------------- */
function applyTheme(){
  document.body.setAttribute('data-theme', state.theme);
  if (tileLayer){
    map.removeLayer(tileLayer);
    tileLayer = L.tileLayer(TILES[state.theme].url, { attribution:TILES[state.theme].attribution, maxZoom:19 }).addTo(map);
  }
}

/* ---------------- Wire up ---------------- */
document.getElementById('themeToggle').addEventListener('click', ()=>{
  state.theme = state.theme === "dark" ? "light" : "dark";
  applyTheme();
});
document.querySelectorAll('.langsw button').forEach(btn=>{
  btn.addEventListener('click', ()=>{ state.lang = btn.dataset.langBtn; renderLanguage(); });
});
document.getElementById('apiKeySave').addEventListener('click', ()=>{
  const val = document.getElementById('apiKeyInput').value.trim();
  state.apiKey = val;
  document.getElementById('keyStatus').textContent = val ? I18N[state.lang].keyOk : "";
  fetchAll();
});
document.getElementById('refreshBtn').addEventListener('click', fetchAll);

/* ---------------- Init ---------------- */
initMap();
renderLanguage();
renderContinentCards();
</script>
</body>
</html>
